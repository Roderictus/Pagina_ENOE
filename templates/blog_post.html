<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | México en Datos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">

    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="/#blog" class="text-blue-600 hover:text-blue-800 font-semibold transition">&larr; Volver al inicio</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow py-12">
        <article class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 bg-white p-8 md:p-12 rounded-2xl shadow-sm border border-slate-200">
            
            <header class="mb-10 text-center">
                <p class="text-slate-500 font-medium mb-3">{{ date }}</p>
                <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight mb-8 leading-tight">
                    {{ title }}
                </h1>
                {% if thumbnail %}
                <img src="{{ thumbnail }}" alt="Portada de {{ title }}" class="w-full h-auto rounded-xl shadow-md object-cover max-h-[400px]">
                {% endif %}
            </header>

            <div class="prose prose-slate prose-lg max-w-none prose-a:text-blue-600 hover:prose-a:text-blue-800 prose-img:rounded-xl">
                {{ content | safe }}
            </div>

        </article>
    </main>

    <footer class="bg-white border-t border-slate-200 mt-12">
        <div class="max-w-4xl mx-auto px-4 py-8 text-center text-slate-500">
            <p>&copy; 2026 México en Datos.</p>
        </div>
    </footer>

</body>
</html>
